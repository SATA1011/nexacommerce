<div class="register-container">
  <div class="register-card">
    
    <!-- Header -->
    <div class="register-header">
      <div class="brand-icon-wrapper">
        <i class="pi pi-user-plus brand-icon"></i>
      </div>
      <h2 class="title">Create your account</h2>
      <p class="subtitle">Join NexaCommerce to discover and shop products</p>
    </div>

    <!-- Feedback Alert Messages -->
    @if (errorMessage()) {
      <div class="mb-4">
        <p-message severity="error" [text]="errorMessage()!"></p-message>
      </div>
    }

    @if (successMessage()) {
      <div class="mb-4">
        <p-message severity="success" [text]="successMessage()! + ' Redirecting to sign in...'"></p-message>
      </div>
    }

    <!-- Registration Form -->
    <form (ngSubmit)="onSubmit()" class="register-form">
      
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="firstName">First name</label>
          <input 
            pInputText
            id="firstName"
            type="text" 
            [(ngModel)]="firstName" 
            name="firstName" 
            required
            placeholder="Sarah"
            class="w-full" />
        </div>
        <div class="form-group">
          <label class="form-label" for="lastName">Last name</label>
          <input 
            pInputText
            id="lastName"
            type="text" 
            [(ngModel)]="lastName" 
            name="lastName" 
            required
            placeholder="Connor"
            class="w-full" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email address</label>
        <input 
          pInputText
          id="email"
          type="email" 
          [(ngModel)]="email" 
          name="email" 
          required
          placeholder="sarah@example.com"
          class="w-full" />
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <p-password 
            id="password"
            [(ngModel)]="password"
            name="password"
            [feedback]="false"
            [toggleMask]="true"
            placeholder="••••••••"
            styleClass="w-full"
            inputStyleClass="w-full">
          </p-password>
        </div>
        <div class="form-group">
          <label class="form-label" for="phoneNumber">Phone <span class="optional-text">(Optional)</span></label>
          <input 
            pInputText
            id="phoneNumber"
            type="tel" 
            [(ngModel)]="phoneNumber" 
            name="phoneNumber"
            placeholder="+1 555-0199"
            class="w-full" />
        </div>
      </div>

      <p-button 
        type="submit"
        label="Create Account"
        [loading]="loading()"
        [disabled]="loading() || !email || !password || !firstName"
        styleClass="w-full"
        class="w-full block mt-2">
      </p-button>

    </form>

    <div class="login-footer">
      <div>
        Already have an account?
        <a routerLink="/auth/login" class="login-link">Sign in</a>
      </div>
      <div class="seller-prompt">
        Looking to sell products?
        <a routerLink="/vendor/become-seller" class="seller-link">Become a seller</a>
      </div>
    </div>

  </div>
</div>
