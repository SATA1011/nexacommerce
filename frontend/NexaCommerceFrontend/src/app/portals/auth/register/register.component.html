<div class="register-container">
  <div class="register-card">
    
    <!-- Header -->
    <div class="register-header">
      <h2 class="title">Create your NexaCommerce Account</h2>
      <p class="subtitle">Join thousands of shoppers and verified merchants worldwide</p>
    </div>

    <!-- Account Type Switcher Tabs -->
    <div class="tabs-container">
      <button (click)="isVendorTab.set(false)"
              [class.tab-active]="!isVendorTab()"
              class="tab-button">
        🛍️ Shopper Account
      </button>
      <button (click)="isVendorTab.set(true)"
              [class.tab-active]="isVendorTab()"
              class="tab-button">
        🏪 Merchant / Seller
      </button>
    </div>

    <!-- Feedback Alert Messages -->
    @if (errorMessage()) {
      <div class="alert-error">
        <svg class="alert-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (successMessage()) {
      <div class="alert-success">
        <svg class="alert-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span>{{ successMessage() }} Redirecting to login...</span>
      </div>
    }

    <!-- Registration Form -->
    <form (ngSubmit)="onSubmit()" class="register-form">
      
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" [(ngModel)]="firstName" name="firstName" required
                 placeholder="Sarah"
                 class="form-input" />
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" [(ngModel)]="lastName" name="lastName" required
                 placeholder="Connor"
                 class="form-input" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" [(ngModel)]="email" name="email" required
               placeholder="sarah@example.com"
               class="form-input" />
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" [(ngModel)]="password" name="password" required
                 placeholder="••••••••"
                 class="form-input" />
        </div>
        <div class="form-group">
          <label class="form-label">Phone (Optional)</label>
          <input type="tel" [(ngModel)]="phoneNumber" name="phoneNumber"
                 placeholder="+1 555-0199"
                 class="form-input" />
        </div>
      </div>

      <!-- Merchant Fields (Condition: isVendorTab = true) -->
      @if (isVendorTab()) {
        <div class="merchant-box">
          <span class="merchant-title">Merchant Store Details</span>
          
          <div class="form-group">
            <label class="merchant-label">Store Name</label>
            <input type="text" [(ngModel)]="storeName" name="storeName" required
                   placeholder="e.g. Apex Electronics Co."
                   class="merchant-input" />
          </div>

          <div class="merchant-grid">
            <div class="form-group">
              <label class="merchant-label">Tax / VAT Number</label>
              <input type="text" [(ngModel)]="taxNumber" name="taxNumber"
                     placeholder="TAX-99882"
                     class="merchant-input" />
            </div>
            <div class="form-group">
              <label class="merchant-label">Business Address</label>
              <input type="text" [(ngModel)]="businessAddress" name="businessAddress"
                     placeholder="Suite 100, Tech Park"
                     class="merchant-input" />
            </div>
          </div>
        </div>
      }

      <button type="submit"
              [disabled]="loading() || !email || !password || !firstName || (isVendorTab() && !storeName)"
              class="submit-button">
        @if (loading()) {
          <svg class="loading-spinner" fill="none" viewBox="0 0 24 24">
            <circle class="spinner-circle" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="spinner-path" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Creating Account...</span>
        } @else {
          <span>{{ isVendorTab() ? 'Submit Merchant Application' : 'Create Customer Account' }}</span>
        }
      </button>

    </form>

    <div class="login-footer">
      Already registered?
      <a routerLink="/auth/login" class="login-link">Sign in here</a>
    </div>

  </div>
</div>
