<div class="register-container">
  <div class="register-card">
    
    <!-- Header -->
    <div class="register-header">
      <h2 class="title">Create your Buyer Account</h2>
      <p class="subtitle">Join thousands of shoppers discovering products on NexaCommerce</p>
    </div>

    <!-- Feedback Alert Messages -->
    @if (errorMessage()) {
      <div class="alert-error">
        <svg class="alert-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    @if (successMessage()) {
      <div class="alert-success">
        <svg class="alert-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span>{{ successMessage() }} Redirecting to login...</span>
      </div>
    }

    <!-- Registration Form -->
    <form (ngSubmit)="onSubmit()" class="register-form">
      
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input type="text" [(ngModel)]="firstName" name="firstName" required
                 placeholder="Sarah"
                 class="form-input" />
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input type="text" [(ngModel)]="lastName" name="lastName" required
                 placeholder="Connor"
                 class="form-input" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email" [(ngModel)]="email" name="email" required
               placeholder="sarah@example.com"
               class="form-input" />
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input [type]="showPassword() ? 'text' : 'password'"
                   [(ngModel)]="password"
                   name="password"
                   required
                   placeholder="••••••••"
                   class="form-input" />
            <button type="button"
                    (click)="showPassword.set(!showPassword())"
                    class="toggle-password-btn"
                    [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
              @if (showPassword()) {
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
                </svg>
              } @else {
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              }
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Phone (Optional)</label>
          <input type="tel" [(ngModel)]="phoneNumber" name="phoneNumber"
                 placeholder="+1 555-0199"
                 class="form-input" />
        </div>
      </div>

      <button type="submit"
              [disabled]="loading() || !email || !password || !firstName"
              class="submit-button">
        @if (loading()) {
          <svg class="loading-spinner" fill="none" viewBox="0 0 24 24">
            <circle class="spinner-circle" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="spinner-path" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Creating Account...</span>
        } @else {
          <span>Create Customer Account</span>
        }
      </button>

    </form>

    <div class="login-footer">
      Already registered?
      <a routerLink="/auth/login" class="login-link">Sign in here</a>
      <div style="margin-top: 12px; font-size: 0.875rem; color: #64748b;">
        Want to sell products?
        <a routerLink="/vendor/become-seller" class="login-link" style="font-weight: 600; color: #4f46e5;">Open a Seller Store</a>
      </div>
    </div>

  </div>
</div>
