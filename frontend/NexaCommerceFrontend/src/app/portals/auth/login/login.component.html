<div class="login-container">
  <div class="login-card">
    
    <!-- Header -->
    <div class="login-header">
      <div class="brand-icon-wrapper">
        <i class="pi pi-shopping-bag brand-icon"></i>
      </div>
      <h2 class="title">Sign in to NexaCommerce</h2>
      <p class="subtitle">Enter your email and password to access your account</p>
    </div>

    <!-- Error Message Alert -->
    @if (errorMessage()) {
      <div class="mb-4">
        <p-message severity="error" [text]="errorMessage()!"></p-message>
      </div>
    }

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label class="form-label" for="loginEmail">Email address</label>
        <input 
          pInputText
          id="loginEmail"
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="name@company.com"
          class="w-full" />
      </div>

      <div class="form-group">
        <div class="password-row">
          <label class="form-label" for="loginPassword">Password</label>
          <a href="javascript:void(0)" class="forgot-link">Forgot password?</a>
        </div>
        <p-password 
          id="loginPassword"
          [(ngModel)]="password"
          name="password"
          [feedback]="false"
          [toggleMask]="true"
          placeholder="••••••••"
          styleClass="w-full"
          inputStyleClass="w-full">
        </p-password>
      </div>

      <div class="remember-row flex items-center gap-2">
        <p-checkbox 
          [(ngModel)]="rememberMe" 
          [binary]="true" 
          name="rememberMe"
          inputId="rememberMe">
        </p-checkbox>
        <label for="rememberMe" class="checkbox-label">Keep me signed in</label>
      </div>

      <p-button 
        type="submit"
        label="Sign In"
        [loading]="loading()"
        [disabled]="loading() || !email || !password"
        styleClass="w-full"
        class="w-full block mt-2">
      </p-button>
    </form>

    <div class="register-footer">
      Don't have an account?
      <a routerLink="/auth/register" class="register-link">Create account</a>
    </div>

  </div>
</div>
