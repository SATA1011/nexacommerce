<div class="login-container">
  <div class="login-card">
    
    <!-- Header -->
    <div class="login-header">
      <div class="brand-badge">
        <svg class="badge-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
      </div>
      <h2 class="title">Welcome to NexaCommerce</h2>
      <p class="subtitle">Sign in to access your buyer, seller, or admin portal</p>
    </div>

    <!-- Error Message Alert -->
    @if (errorMessage()) {
      <div class="alert-error">
        <svg class="alert-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <span>{{ errorMessage() }}</span>
      </div>
    }

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input type="email"
               [(ngModel)]="email"
               name="email"
               required
               placeholder="name@company.com"
               class="form-input" />
      </div>

      <div class="form-group">
        <div class="password-row">
          <label class="form-label">Password</label>
          <a href="javascript:void(0)" class="forgot-link">Forgot?</a>
        </div>
        <input type="password"
               [(ngModel)]="password"
               name="password"
               required
               placeholder="••••••••"
               class="form-input" />
      </div>

      <div class="remember-row">
        <input type="checkbox" id="rememberMe" [(ngModel)]="rememberMe" name="rememberMe"
               class="checkbox-input" />
        <label for="rememberMe" class="checkbox-label">Keep me signed in on this device</label>
      </div>

      <button type="submit"
              [disabled]="loading() || !email || !password"
              class="submit-button">
        @if (loading()) {
          <svg class="loading-spinner" fill="none" viewBox="0 0 24 24">
            <circle class="spinner-circle" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="spinner-path" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          <span>Authenticating...</span>
        } @else {
          <span>Sign In</span>
        }
      </button>
    </form>

    <div class="register-footer">
      Don't have an account?
      <a routerLink="/auth/register" class="register-link">Create an account</a>
    </div>

  </div>
</div>
